spring.application.name=placement
server.port=8080

spring.datasource.url={DB_URL:jdbc:mysql://localhost:3306/placementdb?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username={DB_USERNAME:root}
spring.datasource.password={DB_PASSWORD:cherry}                       
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
